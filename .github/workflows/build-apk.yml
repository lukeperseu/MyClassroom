name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          echo "APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)" >> $GITHUB_ENV
        elif [ -f "./android-widget-app/gradlew" ]; then
          chmod +x ./android-widget-app/gradlew
          cd ./android-widget-app
          ./gradlew assembleDebug --stacktrace
          echo "APK_PATH=android-widget-app/$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)" >> $GITHUB_ENV
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinhaSala-Anhanguera-APK
        path: ${{ env.APK_PATH }}
